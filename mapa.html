  color: 'blue',
  weight: 4
}).addTo(map);

// Marker setzen mit Hover-Tooltip
route.forEach(r => {
  L.marker(r.coords)
    .addTo(map)
    .bindPopup(`<b>${r.date}</b>`) // Klick = Datum im Popup
    .bindTooltip(r.date, {permanent: false, direction: "top"}); // Hover = Datum
});

// Zoomen, damit alles sichtbar ist
map.fitBounds(polyline.getBounds());

// Haversine: Entfernung in km zwischen zwei Koordinaten
function getDistance(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(lat1 * Math.PI / 180) *
    Math.cos(lat2 * Math.PI / 180) *
    Math.sin(dLon / 2) ** 2;
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// Gesamtkilometer berechnen und auf eine Variable schreiben
let totalKm = 0;
for (let i = 1; i < route.length; i++) {
  const [lat1, lon1] = route[i - 1].coords;
  const [lat2, lon2] = route[i].coords;
  totalKm += getDistance(lat1, lon1, lat2, lon2);
}
totalKm = Number(totalKm.toFixed(2));

// Setze Kilometerwert in die Box
document.getElementById("km-value").textContent = totalKm;

// Menü-Button togglen (zeigen/verstecken)
document.getElementById("menu-button").addEventListener("click", () => {
  const box = document.getElementById("info-box");
  box.style.display = (box.style.display === "block") ? "none" : "block";
});
